# k6 load-test Job. Created by scripts/07-run-load-test.sh (which fills in VUS and DURATION).
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
  namespace: shopverse
  labels: { app.kubernetes.io/name: k6-load-test, app.kubernetes.io/part-of: shopverse }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: k6-load-test, app.kubernetes.io/part-of: shopverse }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345   # the "k6" user in the official image
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: k6
          image: grafana/k6:2.3.0
          args: ["run", "/scripts/shopper.js"]
          env:
            - { name: BASE_URL, value: "http://api-gateway" }
            - { name: VUS, value: "__VUS__" }
            - { name: DURATION, value: "__DURATION__" }
            - { name: HOME, value: /tmp }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: scripts
          configMap: { name: k6-script }
        - name: tmp
          emptyDir: {}
