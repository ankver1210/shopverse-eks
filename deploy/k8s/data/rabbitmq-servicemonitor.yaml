# RabbitMQ ships with a Prometheus plugin (port 15692): queue depth, consumers, message rates.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq
  labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: shopverse }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: rabbitmq }
  endpoints:
    - port: prometheus
      interval: 30s
