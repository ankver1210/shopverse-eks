# Redis 7 — carts and the notification inbox. Append-only file for durability.
# Production alternative: Amazon ElastiCache.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: shopverse }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: shopverse }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: shopverse }
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: shopverse }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999       # "redis" user in the alpine image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--requirepass", "$(REDIS_PASSWORD)", "--appendonly", "yes", "--save", "60 1", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
          ports:
            - { name: redis, containerPort: 6379 }
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: shopverse-secrets, key: redis-password } }
          readinessProbe:
            exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"] }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests: { storage: 2Gi }
