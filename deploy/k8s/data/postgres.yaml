# PostgreSQL 17 — one instance, one database per microservice (see init-databases.sh).
# For real production you'd use Amazon RDS / Aurora (backups, Multi-AZ, patching).
# Running it in-cluster here teaches StatefulSets, PVCs and EBS volumes — and keeps costs low.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: shopverse }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: shopverse }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: shopverse }
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: shopverse }
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 70        # "postgres" user in the alpine image
        runAsGroup: 70
        fsGroup: 70          # makes the EBS volume writable for that group
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: postgres }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: shopverse-secrets, key: postgres-password } }
            # The EBS volume root contains "lost+found", so PGDATA must be a sub-directory.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: USER_SERVICE_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: shopverse-secrets, key: user-service-db-password } }
            - name: PRODUCT_SERVICE_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: shopverse-secrets, key: product-service-db-password } }
            - name: ORDER_SERVICE_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: shopverse-secrets, key: order-service-db-password } }
            - name: INVENTORY_SERVICE_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: shopverse-secrets, key: inventory-service-db-password } }
            - name: PAYMENT_SERVICE_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: shopverse-secrets, key: payment-service-db-password } }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"] }
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"] }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init-scripts, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests: { storage: 10Gi }
