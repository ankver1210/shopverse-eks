# Copies the JSON secret "shopverse/app-secrets" (created by Terraform with random
# passwords) into normal Kubernetes Secrets. Rotate a value in AWS and it syncs here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shopverse-secrets
  namespace: shopverse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: shopverse-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: shopverse/app-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shopverse-secrets
  namespace: shopverse-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: shopverse-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: shopverse/app-secrets
---
# Grafana admin login, consumed by kube-prometheus-stack (grafana.admin.existingSecret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: shopverse/app-secrets
        property: grafana-admin-password
