# Encrypted gp3 EBS volumes (cheaper and faster than gp2), provisioned by the EBS CSI driver.
# WaitForFirstConsumer creates the volume in the same AZ as the pod that uses it.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  fsType: ext4
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
