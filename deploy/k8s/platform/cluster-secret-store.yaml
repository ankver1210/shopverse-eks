# Connects External Secrets Operator to AWS Secrets Manager.
# No credentials here: the operator's pod gets AWS permissions through EKS Pod Identity
# (the IAM role + association are created by Terraform).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: AWS_REGION   # replaced by scripts/02-configure-repo.sh
