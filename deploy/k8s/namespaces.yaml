# Namespaces with Pod Security Admission (PSA) labels.
#   shopverse      -> "restricted": the strictest built-in policy (non-root, no privilege escalation, ...)
#   shopverse-data -> "baseline": databases need a little more freedom; we still WARN on restricted
apiVersion: v1
kind: Namespace
metadata:
  name: shopverse
  labels:
    app.kubernetes.io/part-of: shopverse
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: shopverse-data
  labels:
    app.kubernetes.io/part-of: shopverse
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: shopverse
