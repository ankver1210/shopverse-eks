# payment-service — Go + PostgreSQL. Simulated payments (internal only, never exposed).
image:
  repository: shopverse/payment-service
  tag: "1.0.0"
env:
  DB_HOST: postgres.shopverse-data.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: payments
  DB_USER: payment_service
  DB_SSLMODE: disable
secretEnv:
  DB_PASSWORD: { secretName: shopverse-secrets, key: payment-service-db-password }
resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits: { memory: 128Mi }
networkPolicy:
  # order-service charges payments; api-gateway only polls /readyz for the status page.
  # NetworkPolicies work at L4 (ports), not L7 (paths) — a service mesh can go further.
  allowFrom: [order-service, api-gateway]
