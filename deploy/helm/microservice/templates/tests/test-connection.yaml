{{- if .Values.tests.enabled }}
# Run with: helm test <release> -n shopverse
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "microservice.name" . }}-test
  labels:
    # Deliberately NOT using the selector labels, so the Service/PDB/HPA never pick up this pod.
    app.kubernetes.io/name: {{ include "microservice.name" . }}-test
    app.kubernetes.io/part-of: {{ .Values.global.partOf }}
    app.kubernetes.io/component: helm-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.22.0
      command: ["curl", "--fail", "--silent", "--show-error", "--max-time", "5"]
      args: ["http://{{ include "microservice.name" . }}:{{ .Values.service.port }}/healthz"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
{{- end }}
