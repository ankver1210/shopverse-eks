# External Secrets Operator. Its service account gets AWS permissions via EKS Pod Identity.
installCRDs: true
serviceAccount:
  name: external-secrets
resources:
  requests: { cpu: 10m, memory: 64Mi }
  limits: { memory: 256Mi }
webhook:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
certController:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
