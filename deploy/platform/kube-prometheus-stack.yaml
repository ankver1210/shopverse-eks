# Prometheus + Alertmanager + Grafana + kube-state-metrics + node-exporter.
# Sized for a small learning cluster. Metrics are kept for 2 days (no persistent volume).
grafana:
  admin:
    existingSecret: grafana-admin   # synced from AWS Secrets Manager by External Secrets
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsTimezone: browser
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

prometheus:
  prometheusSpec:
    retention: 2d
    scrapeInterval: 15s
    # Pick up ServiceMonitors / PrometheusRules from every namespace, not only this release's.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 768Mi }
      limits: { memory: 2Gi }

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }

# The EKS control plane is managed by AWS: these components can't be scraped.
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeEtcd: { enabled: false }
kubeProxy: { enabled: false }
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
